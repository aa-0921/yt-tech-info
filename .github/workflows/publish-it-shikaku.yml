name: Publish it-shikaku
on:
  # 長尺 TEST: 火・金 06:47 JST（月・木 21:47 UTC）。cron は数時間遅れるため前倒しし、
  # 公開は engine 側の publishAt（19:00 JST）でそろえる（2026-11-16）
  schedule:
    - cron: "47 21 * * 1,4"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: "YouTube の公開設定"
        required: false
        default: "unlisted"
        type: choice
        options: [unlisted, private, public]
      script:
        description: "台本パス（channels/it-shikaku/ からの相対。空なら未投稿の次の台本）"
        required: false
        type: string
      dry_run:
        description: "true なら publish せず、動画とサムネを artifact に残す（検証用）"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    # 聞き流し長尺（25〜35分）は TTS＋レンダで 60 分を超えるため延長（2026-11-14）
    timeout-minutes: 180
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-0.25.1
        ports:
          - 50021:50021
    steps:
      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: aa-0921/youtube-auto-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install-deps chromium
          playwright install chromium
          cd remotion && npm ci

      - name: Generate SFX assets
        run: python scripts/download_sfx.py

      - name: Run pipeline
        env:
          # 投稿先は電話確認済みの「なんでも全部しらべ帳」(UC8ySgafYxHmwCutIKWxaEYw)。env 名は engine の credentials_prefix に合わせて据え置き（2026-11-15）
          YT_IT_SHIKAKU_CLIENT_ID: ${{ secrets.YT_SHIRABE_CLIENT_ID }}
          YT_IT_SHIKAKU_CLIENT_SECRET: ${{ secrets.YT_SHIRABE_CLIENT_SECRET }}
          YT_IT_SHIKAKU_REFRESH_TOKEN: ${{ secrets.YT_SHIRABE_REFRESH_TOKEN }}
          # 手動 dispatch の公開設定。schedule 起動時は空 → run で YT_PRIVACY_STATUS を設定しない
          PRIVACY_INPUT: ${{ inputs.privacy_status }}
          IT_SHIKAKU_SCRIPT: ${{ inputs.script }}
          # 長尺レンダ用: 上限 150 分・runner の 4 vCPU を使い切る
          REMOTION_RENDER_TIMEOUT_SEC: "9000"
          REMOTION_CONCURRENCY: "4"
        run: |
          # YT_PRIVACY_STATUS があると engine は publishAt 予約をしない（publisher/youtube.py）。
          # schedule 起動時は設定せず、channel.yaml の publish_time で private 予約 → 19:00 公開にする
          if [ -n "$PRIVACY_INPUT" ]; then export YT_PRIVACY_STATUS="$PRIVACY_INPUT"; fi
          python cli.py run it-shikaku ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload dry-run outputs
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-it-shikaku-${{ github.run_id }}
          path: |
            /tmp/yt-auto-it-shikaku-*/output.mp4
            /tmp/yt-auto-it-shikaku-*/shorts_output.mp4
            /tmp/yt-auto-it-shikaku-*/thumb.png
          retention-days: 7
          if-no-files-found: warn

      - name: Persist history
        # dry-run は history を予約するだけで投稿しないので書き戻さない
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 手書き台本チャンネルは history ファイルが無い場合があるので存在するものだけ add する
          for f in channels/it-shikaku/history.json channels/it-shikaku/variation_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          # cli.py 実行中に他のファイルが modified 状態になることがあるため
          # --autostash で git pull --rebase が unstaged 変更で失敗しないようにする
          git diff --staged --quiet || (git commit -m "chore: update it-shikaku history" && git pull --rebase --autostash && git push)

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-it-shikaku-${{ github.run_id }}
          path: /tmp/yt-auto-*
          retention-days: 3
          if-no-files-found: ignore
